[project]
name = "clinic-appointments"
version = "0.1.0"
description = "A live, ADK-backed clinic appointment agent — the promise-driven-agentic-kit's worked example."
requires-python = ">=3.13"
dependencies = [
    "lxml>=5.0",
    "google-adk>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
