[project]
name = "holy-grail-trials"
version = "0.1.0"
description = "A live, Pydantic-AI-on-Vertex agent for the Trials of the Holy Grail — the promise-driven-agentic-kit's second worked example (different framework, same contracts)."
requires-python = ">=3.13"
dependencies = [
    "lxml>=5.0",
    "pydantic-ai>=2.0",
    "google-genai>=1.0",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grail"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
