<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1440" height="1000" fill="#ffffff"/>

  <text x="720" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#1f2937">The Clinic, as a Promise Graph</text>
  <text x="720" y="74" text-anchor="middle" font-size="15" fill="#6b7280">One superagent to the patient; inside, six agents bound by offers (+) and uses (−). Every dependency is declared and checkable.</text>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <!-- Superagent boundary -->
  <rect x="290" y="120" width="1112" height="712" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="312" y="150" font-size="13" font-weight="700" letter-spacing="0.5" fill="#64748b">THE CLINIC · a superagent — one face to the patient, a society within</text>

  <!-- ===== EDGES (behind nodes) ===== -->
  <!-- patient -> orchestrator (outward promise) -->
  <path d="M252 250 C 400 244, 470 246, 586 246" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="418" y="230" text-anchor="middle" font-size="12" fill="#6b7280">book · cancel · reschedule my appointment</text>

  <!-- orchestrator -> book / manage -->
  <path d="M694 292 L 548 388" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="586" y="342" text-anchor="middle" font-size="12" fill="#6b7280">book_appointment</text>
  <path d="M812 292 L 968 388" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="928" y="342" text-anchor="middle" font-size="12" fill="#6b7280">cancel / reschedule</text>

  <!-- book -> insurance -->
  <path d="M478 476 L 440 626" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="432" y="556" text-anchor="end" font-size="12" fill="#6b7280">eligibility_check</text>

  <!-- book -> schedule -->
  <path d="M568 462 C 730 520, 920 560, 1030 626" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="812" y="552" text-anchor="middle" font-size="12" fill="#6b7280">open_slots · commit_booking</text>

  <!-- manage -> schedule -->
  <path d="M1016 476 L 1085 626" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="1100" y="556" text-anchor="start" font-size="12" fill="#6b7280">appointment_record · cancel_slot</text>

  <!-- ===== SHARED verified-patient (indigo) ===== -->
  <path d="M712 292 C 700 420, 724 540, 738 624" stroke="#4338ca" stroke-width="2.2" fill="none" marker-end="url(#i)"/>
  <text x="756" y="452" text-anchor="start" font-size="12" font-weight="700" fill="#4338ca">patient_identity</text>
  <path d="M548 476 C 640 560, 668 592, 700 624" stroke="#4338ca" stroke-width="2.2" fill="none" marker-end="url(#i)"/>
  <text x="596" y="600" text-anchor="middle" font-size="11.5" fill="#4338ca">active_patient</text>
  <path d="M918 476 C 858 560, 828 592, 800 624" stroke="#4338ca" stroke-width="2.2" fill="none" marker-end="url(#i)"/>
  <text x="908" y="600" text-anchor="middle" font-size="11.5" fill="#4338ca">active_patient</text>
  <path d="M556 673 L 604 673" stroke="#4338ca" stroke-width="2.2" fill="none" marker-end="url(#i)"/>
  <path d="M944 673 L 906 673" stroke="#4338ca" stroke-width="2.2" fill="none" marker-end="url(#i)"/>

  <!-- ===== NODES ===== -->
  <!-- Patient (external) -->
  <rect x="72" y="212" width="180" height="76" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="162" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">patient</text>
  <text x="162" y="266" text-anchor="middle" font-size="12" fill="#6b7280">external</text>

  <!-- Orchestrator (LLM) -->
  <rect x="586" y="204" width="300" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="736" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">clinic_orchestrator</text>
  <text x="736" y="260" text-anchor="middle" font-size="12" fill="#6b7280">front desk · LLM</text>

  <!-- book_appointment (LLM) -->
  <rect x="382" y="390" width="256" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">book_appointment</text>
  <text x="510" y="446" text-anchor="middle" font-size="12" fill="#6b7280">booking · LLM</text>

  <!-- manage_appointment (LLM) -->
  <rect x="850" y="390" width="290" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="995" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">manage_appointment</text>
  <text x="995" y="446" text-anchor="middle" font-size="12" fill="#6b7280">cancel / reschedule · LLM</text>

  <!-- insurance_eligibility (service) -->
  <rect x="300" y="628" width="254" height="90" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="427" y="662" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">insurance_eligibility</text>
  <text x="427" y="684" text-anchor="middle" font-size="12" fill="#6b7280">coverage · service</text>

  <!-- patient_registry (shared state, highlighted) -->
  <rect x="606" y="628" width="298" height="90" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2.6"/>
  <text x="755" y="662" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">patient_registry</text>
  <text x="755" y="684" text-anchor="middle" font-size="12" fill="#4338ca">verified patient · shared state</text>

  <!-- provider_schedule (service) -->
  <rect x="946" y="628" width="294" height="90" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="1093" y="662" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">provider_schedule</text>
  <text x="1093" y="684" text-anchor="middle" font-size="12" fill="#6b7280">slots &amp; bookings · service</text>
  <rect x="946" y="730" width="294" height="28" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1093" y="749" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">NoDoubleBook · kept in code</text>

  <!-- ===== POLARITY BADGES (− at the user's end, + at the provider's end) ===== -->
  <!-- 1 patient(−) -> orchestrator(+) -->
  <g><circle cx="270" cy="249" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="266" y1="249" x2="274" y2="249" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="568" cy="246" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="564" y1="246" x2="572" y2="246" stroke="#15803d" stroke-width="1.9"/><line x1="568" y1="242" x2="568" y2="250" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 2 orchestrator(−) -> book(+) -->
  <g><circle cx="681" cy="301" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="677" y1="301" x2="685" y2="301" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="562" cy="378" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="558" y1="378" x2="566" y2="378" stroke="#15803d" stroke-width="1.9"/><line x1="562" y1="374" x2="562" y2="382" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 3 orchestrator(−) -> manage(+) -->
  <g><circle cx="825" cy="301" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="821" y1="301" x2="829" y2="301" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="954" cy="379" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="950" y1="379" x2="958" y2="379" stroke="#15803d" stroke-width="1.9"/><line x1="954" y1="375" x2="954" y2="383" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 4 book(−) -> insurance(+) -->
  <g><circle cx="474" cy="492" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="470" y1="492" x2="478" y2="492" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="443" cy="610" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="439" y1="610" x2="447" y2="610" stroke="#15803d" stroke-width="1.9"/><line x1="443" y1="606" x2="443" y2="614" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 5 book(−) -> schedule(+) -->
  <g><circle cx="588" cy="470" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="584" y1="470" x2="592" y2="470" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="1018" cy="617" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="1014" y1="617" x2="1022" y2="617" stroke="#15803d" stroke-width="1.9"/><line x1="1018" y1="613" x2="1018" y2="621" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 6 manage(−) -> schedule(+) -->
  <g><circle cx="1022" cy="493" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="1018" y1="493" x2="1026" y2="493" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="1079" cy="609" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="1075" y1="609" x2="1083" y2="609" stroke="#15803d" stroke-width="1.9"/><line x1="1079" y1="605" x2="1079" y2="613" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 7 orchestrator(−) -> registry(+) -->
  <g><circle cx="710" cy="311" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="706" y1="311" x2="714" y2="311" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="736" cy="606" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="732" y1="606" x2="740" y2="606" stroke="#15803d" stroke-width="1.9"/><line x1="736" y1="602" x2="736" y2="610" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 8 book(−) -> registry(+) -->
  <g><circle cx="562" cy="489" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="558" y1="489" x2="566" y2="489" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="687" cy="611" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="683" y1="611" x2="691" y2="611" stroke="#15803d" stroke-width="1.9"/><line x1="687" y1="607" x2="687" y2="615" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 9 manage(−) -> registry(+) -->
  <g><circle cx="906" cy="491" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="902" y1="491" x2="910" y2="491" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="813" cy="610" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="809" y1="610" x2="817" y2="610" stroke="#15803d" stroke-width="1.9"/><line x1="813" y1="606" x2="813" y2="614" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 10 insurance(−) -> registry(+) -->
  <g><circle cx="568" cy="673" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="564" y1="673" x2="572" y2="673" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="592" cy="673" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="588" y1="673" x2="596" y2="673" stroke="#15803d" stroke-width="1.9"/><line x1="592" y1="669" x2="592" y2="677" stroke="#15803d" stroke-width="1.9"/></g>
  <!-- 11 schedule(−) -> registry(+) -->
  <g><circle cx="934" cy="673" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="930" y1="673" x2="938" y2="673" stroke="#334155" stroke-width="1.9"/></g>
  <g><circle cx="912" cy="673" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="908" y1="673" x2="916" y2="673" stroke="#15803d" stroke-width="1.9"/><line x1="912" y1="669" x2="912" y2="677" stroke="#15803d" stroke-width="1.9"/></g>

  <!-- ===== LEGEND ===== -->
  <rect x="72" y="392" width="196" height="392" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="90" y="418" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#9ca3af">HOW TO READ THIS</text>

  <rect x="90" y="436" width="30" height="20" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="128" y="451" font-size="12.5" fill="#374151">LLM agent</text>

  <rect x="90" y="470" width="30" height="20" rx="5" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="128" y="485" font-size="12.5" fill="#374151">service agent</text>

  <rect x="90" y="504" width="30" height="20" rx="5" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="128" y="519" font-size="12.5" fill="#374151">external</text>

  <line x1="92" y1="548" x2="122" y2="548" stroke="#9ca3af" stroke-width="2" marker-end="url(#g)"/>
  <text x="90" y="570" font-size="11.5" fill="#374151">A &#8594; B: A uses (−)</text>
  <text x="90" y="586" font-size="11.5" fill="#374151">an offer B makes (+)</text>

  <g><circle cx="100" cy="612" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><line x1="96" y1="612" x2="104" y2="612" stroke="#334155" stroke-width="1.9"/></g>
  <text x="116" y="617" font-size="11.5" fill="#374151">use, at the user's end</text>
  <g><circle cx="100" cy="640" r="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><line x1="96" y1="640" x2="104" y2="640" stroke="#15803d" stroke-width="1.9"/><line x1="100" y1="636" x2="100" y2="644" stroke="#15803d" stroke-width="1.9"/></g>
  <text x="116" y="645" font-size="11.5" fill="#374151">offer, at the provider</text>

  <line x1="90" y1="666" x2="256" y2="666" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="92" y1="690" x2="122" y2="690" stroke="#4338ca" stroke-width="2.4" marker-end="url(#i)"/>
  <text x="90" y="712" font-size="11.5" fill="#4338ca">shared verified-</text>
  <text x="90" y="728" font-size="11.5" fill="#4338ca">patient dependency</text>

  <text x="90" y="756" font-size="11.5" font-weight="700" fill="#374151">Every − must meet a +.</text>
  <text x="90" y="772" font-size="11.5" font-weight="700" fill="#374151">Unmatched = build fail.</text>
</svg>
