<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">One Contract, Three Readers</text>
  <text x="600" y="84" text-anchor="middle" font-size="17" fill="#6b7280">One safety intent, coordinated across three readings by a shared name.</text>

  <!-- Contract card -->
  <rect x="430" y="108" width="340" height="118" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">THE CONTRACT</text>
  <text x="600" y="161" text-anchor="middle" font-size="13" fill="#6b7280">one document &#183; agent_clinic.xml</text>
  <rect x="452" y="176" width="296" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="197" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#b45309">PatientVerifiedBeforeWorkflow</text>

  <!-- Arrows to three readers -->
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M600 226 C 400 260, 230 250, 230 300" marker-end="url(#arrow)"/>
    <path d="M600 226 L 600 300" marker-end="url(#arrow)"/>
    <path d="M600 226 C 800 260, 970 250, 970 300" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Reader 1: Model checker -->
  <rect x="70" y="304" width="320" height="158" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="340" font-size="17" font-weight="700" fill="#2563eb">1 &#183; MODEL CHECKER</text>
  <text x="92" y="370" font-size="14" fill="#1f2937">Checks the assertion in every</text>
  <text x="92" y="390" font-size="14" fill="#1f2937">reachable modeled state.</text>
  <text x="92" y="420" font-size="12" font-family="Menlo, Consolas, monospace" fill="#6b7280">reads: patient_verified</text>
  <rect x="92" y="430" width="176" height="24" rx="12" fill="#2563eb"/>
  <text x="180" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">CHECK &#183; design-time</text>

  <!-- Reader 2: Builder -->
  <rect x="440" y="304" width="320" height="158" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="462" y="340" font-size="17" font-weight="700" fill="#7c3aed">2 &#183; BUILDER (code)</text>
  <text x="462" y="370" font-size="14" fill="#1f2937">Reads the promises; binds tools</text>
  <text x="462" y="390" font-size="14" fill="#1f2937">and wires who depends on what.</text>
  <text x="462" y="420" font-size="12" font-family="Menlo, Consolas, monospace" fill="#6b7280">reads: patient_verified</text>
  <rect x="462" y="430" width="120" height="24" rx="12" fill="#7c3aed"/>
  <text x="522" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">COMPOSE</text>

  <!-- Reader 3: LLM -->
  <rect x="810" y="304" width="320" height="158" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="832" y="340" font-size="17" font-weight="700" fill="#d97706">3 &#183; THE LLM</text>
  <text x="832" y="370" font-size="14" fill="#1f2937">Follows the whole document as</text>
  <text x="832" y="390" font-size="14" fill="#1f2937">its operating instructions.</text>
  <text x="832" y="420" font-size="12" font-family="Menlo, Consolas, monospace" fill="#6b7280">reads: patient_verified</text>
  <rect x="832" y="430" width="150" height="24" rx="12" fill="#d97706"/>
  <text x="907" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ACT &#183; runtime</text>

  <!-- Enforcement band -->
  <rect x="70" y="500" width="1060" height="92" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="92" y="536" font-size="17" font-weight="700" fill="#065f46">4 &#183; ENFORCEMENT CODE</text>
  <text x="92" y="565" font-size="14" fill="#065f46">The authority boundary assesses consequential proposals and refuses unmet conditions.</text>
  <rect x="905" y="516" width="200" height="26" rx="13" fill="#059669"/>
  <text x="1005" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ASSESS &#183; runtime &#8594; EVIDENCE</text>

  <!-- Bottom banner -->
  <text x="600" y="648" text-anchor="middle" font-size="16" fill="#6b7280">Model-checked at design time. Assessed at runtime.</text>
  <text x="600" y="686" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Trust grounded in evidence, not instructions.</text>
</svg>
