<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-size="32" font-weight="700" fill="#1f2937">The Design Loop</text>
  <text x="640" y="82" text-anchor="middle" font-size="16" fill="#6b7280">fizz turns verification into a feedback loop your AI assistant can close on its own.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- 1. AUTHOR -->
  <rect x="50" y="140" width="300" height="172" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="50" y="140" width="300" height="46" rx="12" fill="#6366f1"/>
  <rect x="50" y="170" width="300" height="16" fill="#6366f1"/>
  <text x="70" y="171" font-size="17" font-weight="700" fill="#ffffff">1 &#183; AUTHOR</text>
  <text x="70" y="222" font-size="14" fill="#1f2937">You and your AI coding</text>
  <text x="70" y="244" font-size="14" fill="#1f2937">assistant write the contract:</text>
  <text x="70" y="266" font-size="14" fill="#1f2937">its state machine, guards,</text>
  <text x="70" y="288" font-size="14" fill="#1f2937">and invariants.</text>

  <!-- arrow AUTHOR -> CHECK -->
  <path d="M350 226 L 426 226" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 2. CHECK -->
  <rect x="430" y="140" width="300" height="172" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="430" y="140" width="300" height="46" rx="12" fill="#2563eb"/>
  <rect x="430" y="170" width="300" height="16" fill="#2563eb"/>
  <text x="450" y="171" font-size="17" font-weight="700" fill="#ffffff">2 &#183; CHECK</text>
  <text x="450" y="222" font-size="14" fill="#1f2937">Run fizz. The model checker</text>
  <text x="450" y="244" font-size="14" fill="#1f2937">explores every reachable</text>
  <text x="450" y="266" font-size="14" fill="#1f2937">state and returns a verdict.</text>

  <!-- CHECK -> PASS -->
  <path d="M730 187 L 816 187" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="762" y="179" font-size="12" font-weight="700" fill="#059669">PASS</text>
  <!-- CHECK -> FIX -->
  <path d="M730 262 L 766 262 Q 778 262 778 274 L 778 381 Q 778 393 790 393 L 816 393" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="744" y="255" font-size="12" font-weight="700" fill="#e11d48">FAIL</text>

  <!-- PASS terminal -->
  <rect x="820" y="150" width="410" height="74" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="844" y="185" font-size="17" font-weight="700" fill="#065f46">PASS: model satisfies claim.</text>
  <text x="844" y="209" font-size="14" fill="#047857">On to Build &#8594;</text>

  <!-- FIX card -->
  <rect x="820" y="286" width="410" height="214" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="820" y="286" width="410" height="46" rx="12" fill="#d97706"/>
  <rect x="820" y="316" width="410" height="16" fill="#d97706"/>
  <text x="842" y="317" font-size="17" font-weight="700" fill="#ffffff">3 &#183; FIX</text>
  <text x="842" y="366" font-size="14" fill="#1f2937">fizz returns a counterexample: the exact</text>
  <text x="842" y="388" font-size="14" fill="#1f2937">step-by-step path to the bad state. Your</text>
  <text x="842" y="410" font-size="14" fill="#1f2937">assistant reads it and repairs the contract.</text>
  <rect x="842" y="426" width="366" height="56" rx="8" fill="#f3f4f6"/>
  <text x="858" y="450" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">Init &#8594; verify &#8594; book &#8594; book</text>
  <text x="858" y="470" font-size="13" font-family="Menlo, Consolas, monospace" fill="#e11d48">&#8594; violates NoDoubleBook</text>

  <!-- loop back FIX -> AUTHOR -->
  <path d="M900 500 L 900 574 Q 900 590 884 590 L 216 590 Q 200 590 200 574 L 200 314" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arI)"/>
  <text x="550" y="583" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">the assistant repairs the contract, then re-runs, until it's green</text>
</svg>
