<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1280 760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="850" fill="#ffffff"/>

  <!-- Contract card -->
  <rect x="490" y="104" width="300" height="80" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="640" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">THE CONTRACT</text>
  <text x="640" y="160" text-anchor="middle" font-size="13" fill="#6b7280">one document &#183; agent_*.xml</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M640 184 L 640 202 Q 640 216 626 216 L 244 216 Q 230 216 230 230 L 230 248" marker-end="url(#a)"/>
    <path d="M640 184 L 640 248" marker-end="url(#a)"/>
    <path d="M640 184 L 640 202 Q 640 216 654 216 L 1036 216 Q 1050 216 1050 230 L 1050 248" marker-end="url(#a)"/>
  </g>

  <!-- ===== DESIGN ===== -->
  <rect x="40" y="250" width="380" height="450" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="250" width="380" height="52" rx="12" fill="#2563eb"/>
  <rect x="40" y="286" width="380" height="16" fill="#2563eb"/>
  <text x="230" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">DESIGN</text>

  <text x="62" y="340" font-size="12" font-weight="700" letter-spacing="1" fill="#9ca3af">READS IT WITH</text>
  <text x="62" y="366" font-size="16" font-weight="700" fill="#1f2937">fizz, the FizzBee model checker</text>

  <line x1="62" y1="410" x2="398" y2="410" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="62" y="440" font-size="12" font-weight="700" letter-spacing="1" fill="#9ca3af">PRODUCES</text>
  <text x="62" y="466" font-size="14" fill="#1f2937">A verdict. PASS means modeled claims hold.</text>
  <text x="62" y="488" font-size="14" fill="#1f2937">A failure returns a counterexample: the</text>
  <text x="62" y="510" font-size="14" fill="#1f2937">exact step-by-step path to the bad state,</text>
  <text x="62" y="532" font-size="14" fill="#1f2937">so you know precisely what to fix.</text>

  <rect x="62" y="640" width="150" height="26" rx="13" fill="#2563eb"/>
  <text x="137" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">CHECK &#183; design-time</text>

  <!-- ===== BUILD ===== -->
  <rect x="450" y="250" width="380" height="450" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="450" y="250" width="380" height="52" rx="12" fill="#7c3aed"/>
  <rect x="450" y="286" width="380" height="16" fill="#7c3aed"/>
  <text x="640" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">BUILD</text>

  <text x="472" y="340" font-size="12" font-weight="700" letter-spacing="1" fill="#9ca3af">READS IT WITH</text>
  <text x="472" y="366" font-size="16" font-weight="700" fill="#1f2937">Your AI coding assistant</text>
  <text x="472" y="386" font-size="13" fill="#6b7280">+ the kit's authoring Skills</text>

  <g font-size="13" font-weight="700">
    <rect x="472" y="404" width="104" height="28" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="524" y="423" text-anchor="middle" fill="#6d28d9">Claude Code</text>
    <rect x="584" y="404" width="70" height="28" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="619" y="423" text-anchor="middle" fill="#6d28d9">Codex</text>
    <rect x="662" y="404" width="96" height="28" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="710" y="423" text-anchor="middle" fill="#6d28d9">OpenCode</text>
  </g>

  <line x1="472" y1="470" x2="808" y2="470" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="472" y="500" font-size="12" font-weight="700" letter-spacing="1" fill="#9ca3af">PRODUCES</text>
  <text x="472" y="526" font-size="14" fill="#1f2937">The agent itself: framework wiring,</text>
  <text x="472" y="548" font-size="14" fill="#1f2937">plus authority code and tests traced</text>
  <text x="472" y="570" font-size="14" fill="#1f2937">to selected safety claims.</text>

  <rect x="472" y="640" width="96" height="26" rx="13" fill="#7c3aed"/>
  <text x="520" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">COMPOSE</text>

  <!-- ===== OPERATE ===== -->
  <rect x="860" y="250" width="380" height="450" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="860" y="250" width="380" height="52" rx="12" fill="#059669"/>
  <rect x="860" y="286" width="380" height="16" fill="#059669"/>
  <text x="1050" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">RUN</text>

  <text x="882" y="340" font-size="12" font-weight="700" letter-spacing="1" fill="#9ca3af">READS IT WITH</text>
  <text x="882" y="366" font-size="16" font-weight="700" fill="#1f2937">The LLM, in any agentic framework</text>

  <g font-size="12" font-weight="700">
    <rect x="882" y="382" width="92" height="26" rx="13" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="928" y="399" text-anchor="middle" fill="#047857">LangGraph</text>
    <rect x="982" y="382" width="98" height="26" rx="13" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="1031" y="399" text-anchor="middle" fill="#047857">Pydantic AI</text>
    <rect x="1088" y="382" width="72" height="26" rx="13" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="1124" y="399" text-anchor="middle" fill="#047857">CrewAI</text>
    <rect x="882" y="416" width="104" height="26" rx="13" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="934" y="433" text-anchor="middle" fill="#047857">Google ADK</text>
    <rect x="994" y="416" width="150" height="26" rx="13" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="1069" y="433" text-anchor="middle" fill="#047857">OpenAI Agents SDK</text>
    <rect x="1152" y="416" width="72" height="26" rx="13" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="1188" y="433" text-anchor="middle" fill="#059669">+ more</text>
  </g>

  <line x1="882" y1="470" x2="1218" y2="470" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="882" y="500" font-size="12" font-weight="700" letter-spacing="1" fill="#9ca3af">PRODUCES</text>
  <text x="882" y="526" font-size="14" fill="#1f2937">A live agent, with authority code</text>
  <text x="882" y="548" font-size="14" fill="#1f2937">assessing consequential actions at</text>
  <text x="882" y="570" font-size="14" fill="#1f2937">runtime.</text>

  <rect x="882" y="640" width="210" height="26" rx="13" fill="#059669"/>
  <text x="987" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ASSESS &#183; runtime &#8594; EVIDENCE</text>

  <!-- Bottom banner -->
  <text x="640" y="758" text-anchor="middle" font-size="16" fill="#6b7280">Model-checked at design. Assessed at runtime.</text>
  <text x="640" y="798" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Trust grounded in evidence, not instructions.</text>
</svg>
