<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Clinic booking runtime swimlane</title>
  <desc id="desc">A patient request moves through the orchestrator, booking agent, identity and eligibility services, and authoritative schedule. The final schedule decision branches to either a commit receipt or a slot-taken refusal and alternate-slot response.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17202b" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#607181"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e6eaf"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e7d54"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#b84945"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2733; letter-spacing: 0; }
      .title { font-size: 43px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #566575; }
      .lane { font-size: 18px; font-weight: 700; }
      .lane-copy { font-size: 14px; fill: #5d6d7c; }
      .step { font-size: 17px; font-weight: 700; }
      .detail { font-size: 15px; fill: #5a6978; }
      .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .legend { font-size: 15px; font-weight: 600; }
      .band-title { font-size: 27px; font-weight: 700; fill: #ffffff; }
      .band-copy { font-size: 18px; fill: #dce5ec; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#f6f8fa"/>
  <rect width="1800" height="8" fill="#2c64a0"/>
  <text x="60" y="72" class="title">One booking request, from intent to authoritative outcome</text>
  <text x="60" y="108" class="subtitle">The LLM path remains flexible until the schedule makes one deterministic decision against current state.</text>
  <line x1="1320" y1="70" x2="1368" y2="70" stroke="#3e7d54" stroke-width="5"/>
  <text x="1380" y="76" class="legend">commit path</text>
  <line x1="1510" y1="70" x2="1558" y2="70" stroke="#b84945" stroke-width="5"/>
  <text x="1570" y="76" class="legend">refusal path</text>

  <!-- Lane headers -->
  <rect x="60" y="142" width="300" height="76" rx="8" fill="#f1eef7"/>
  <text x="210" y="174" class="lane" text-anchor="middle">patient</text>
  <text x="210" y="199" class="lane-copy" text-anchor="middle">request · confirm · assess</text>
  <rect x="390" y="142" width="300" height="76" rx="8" fill="#e5edf7"/>
  <text x="540" y="174" class="lane" text-anchor="middle">clinic_orchestrator</text>
  <text x="540" y="199" class="lane-copy" text-anchor="middle">verify · classify · route</text>
  <rect x="720" y="142" width="300" height="76" rx="8" fill="#eaf1fa"/>
  <text x="870" y="174" class="lane" text-anchor="middle">book_appointment</text>
  <text x="870" y="199" class="lane-copy" text-anchor="middle">resolve · check · select · confirm</text>
  <rect x="1050" y="142" width="300" height="76" rx="8" fill="#faecd8"/>
  <text x="1200" y="174" class="lane" text-anchor="middle">registry + eligibility</text>
  <text x="1200" y="199" class="lane-copy" text-anchor="middle">identity and coverage facts</text>
  <rect x="1380" y="142" width="360" height="76" rx="8" fill="#e7f2ea"/>
  <text x="1560" y="174" class="lane" text-anchor="middle">provider_schedule</text>
  <text x="1560" y="199" class="lane-copy" text-anchor="middle">authoritative slots and appointments</text>

  <!-- Lane guides -->
  <line x1="210" y1="232" x2="210" y2="1050" stroke="#d1d9e1" stroke-width="2"/>
  <line x1="540" y1="232" x2="540" y2="1050" stroke="#d1d9e1" stroke-width="2"/>
  <line x1="870" y1="232" x2="870" y2="1050" stroke="#d1d9e1" stroke-width="2"/>
  <line x1="1200" y1="232" x2="1200" y2="1050" stroke="#d1d9e1" stroke-width="2"/>
  <line x1="1560" y1="232" x2="1560" y2="1050" stroke="#d1d9e1" stroke-width="2"/>

  <!-- 1 Identity request -->
  <circle cx="210" cy="270" r="17" fill="#75579a"/>
  <text x="210" y="276" class="num" text-anchor="middle">1</text>
  <path d="M228 270 H522" fill="none" stroke="#607181" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="260" y="257" class="step">“I'm Ada Lovelace...”</text>
  <text x="260" y="288" class="detail">identity and booking intent enter one conversation</text>

  <!-- 2 verify registry -->
  <circle cx="540" cy="350" r="17" fill="#2e6eaf"/>
  <text x="540" y="356" class="num" text-anchor="middle">2</text>
  <path d="M558 350 H1182" fill="none" stroke="#2e6eaf" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="650" y="337" class="step">verify_patient(name, dob)</text>
  <text x="650" y="368" class="detail">tool adapter delegates to PatientRegistry</text>

  <!-- 3 registry result -->
  <circle cx="1200" cy="430" r="17" fill="#b77720"/>
  <text x="1200" y="436" class="num" text-anchor="middle">3</text>
  <path d="M1182 430 H558" fill="none" stroke="#607181" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="417" class="step">active_patient = P1</text>
  <text x="720" y="448" class="detail">registry sets session identity; downstream tools reuse it</text>

  <!-- 4 route -->
  <circle cx="540" cy="510" r="17" fill="#2e6eaf"/>
  <text x="540" y="516" class="num" text-anchor="middle">4</text>
  <path d="M558 510 H852" fill="none" stroke="#2e6eaf" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="620" y="497" class="step">route booking intent</text>
  <text x="620" y="528" class="detail">subagent receives original request + verified context</text>

  <!-- 5 eligibility -->
  <circle cx="870" cy="590" r="17" fill="#2e6eaf"/>
  <text x="870" y="596" class="num" text-anchor="middle">5</text>
  <path d="M888 590 H1182" fill="none" stroke="#607181" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="922" y="577" class="step">check_eligibility(dermatology)</text>
  <text x="922" y="608" class="detail">PLAN_A → eligible, point-in-time</text>

  <!-- 6 open slots -->
  <circle cx="870" cy="670" r="17" fill="#2e6eaf"/>
  <text x="870" y="676" class="num" text-anchor="middle">6</text>
  <path d="M888 670 H1542" fill="none" stroke="#607181" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1030" y="657" class="step">list_open_slots(PR1)</text>
  <text x="1030" y="688" class="detail">read current open schedule; present choices</text>

  <!-- 7 patient confirms -->
  <circle cx="210" cy="750" r="17" fill="#75579a"/>
  <text x="210" y="756" class="num" text-anchor="middle">7</text>
  <path d="M228 750 H852" fill="none" stroke="#607181" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="370" y="737" class="step">confirm exact provider + date + time</text>
  <text x="370" y="768" class="detail">external confirmation quenches booking_confirmed</text>

  <!-- 8 commit proposal -->
  <circle cx="870" cy="830" r="17" fill="#2e6eaf"/>
  <text x="870" y="836" class="num" text-anchor="middle">8</text>
  <path d="M888 830 H1542" fill="none" stroke="#607181" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="985" y="817" class="step">create_booking(... slot_id="S1")</text>
  <text x="985" y="848" class="detail">LLM proposes; tool resolves active patient P1</text>

  <!-- 9 authoritative decision -->
  <g filter="url(#shadow)"><rect x="1392" y="874" width="336" height="116" rx="8" fill="#ffffff" stroke="#c8d1da"/></g>
  <circle cx="1424" cy="908" r="17" fill="#3e7d54"/>
  <text x="1424" y="914" class="num" text-anchor="middle">9</text>
  <text x="1454" y="914" class="step">reassess current state</text>
  <text x="1418" y="948" class="mono">confirmed · clearance · provider</text>
  <text x="1418" y="974" class="mono">slot exists · slot.status == open</text>

  <!-- Success branch -->
  <path d="M1560 990 V1014 Q1560 1028 1546 1028 H888" fill="none" stroke="#3e7d54" stroke-width="4" marker-end="url(#green-arrow)"/>
  <text x="1110" y="1015" class="label" fill="#356b48">OPEN → MARK BOOKED + CREATE APPOINTMENT</text>
  <rect x="720" y="1004" width="300" height="70" rx="8" fill="#e7f2ea"/>
  <text x="870" y="1033" class="step" text-anchor="middle">success dictionary</text>
  <text x="870" y="1058" class="mono" text-anchor="middle">appointment A2</text>
  <path d="M720 1040 H228" fill="none" stroke="#3e7d54" stroke-width="4" marker-end="url(#green-arrow)"/>

  <!-- Refusal branch -->
  <path d="M1728 932 H1750 Q1764 932 1764 946 V1080 Q1764 1094 1750 1094 H888" fill="none" stroke="#b84945" stroke-width="4" marker-end="url(#red-arrow)"/>
  <text x="1140" y="1082" class="label" fill="#9d403c">TAKEN → REFUSE WITHOUT ANOTHER BOOKING</text>
  <rect x="720" y="1064" width="300" height="70" rx="8" fill="#f8e9e7"/>
  <text x="870" y="1093" class="step" text-anchor="middle">slot_taken refusal</text>
  <text x="870" y="1118" class="mono" text-anchor="middle">unmet: slot_available</text>
  <path d="M720 1100 H228" fill="none" stroke="#b84945" stroke-width="4" marker-end="url(#red-arrow)"/>

  <!-- Patient outcomes labels -->
  <text x="82" y="1032" class="step">booked response</text>
  <text x="82" y="1060" class="detail">grounded in appointment</text>
  <text x="82" y="1092" class="step">or alternate offer</text>
  <text x="82" y="1120" class="detail">never silently rebook</text>

  <rect x="60" y="1140" width="1680" height="4" fill="#223547"/>
</svg>
